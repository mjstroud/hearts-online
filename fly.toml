# Fly.io config. Deployed by GitHub Actions; see README → Deploying.
app = "hearts-table"
primary_region = "ord"

[build]

[env]
  DATABASE_PATH = "/data/hearts.db"
  PORT = "8080"

[[mounts]]
  source = "hearts_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running: SQLite lives on its volume and live games need a warm server.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Every open game tab holds a live-update (SSE) connection, so allow far more than Fly's default of 25.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  # Also wakes the computer players right after a deploy or restart.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
