# Fly.io config. Change `app` to a unique name, then see README → Deploying.
app = "hearts-table"
primary_region = "ord"

[build]

[env]
  DATABASE_PATH = "/data/hearts.db"
  PORT = "8080"

[[mounts]]
  source = "hearts_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running: SQLite lives on its volume and live games need a warm server.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
